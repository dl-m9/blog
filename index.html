<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog - Senkang Forest Hu</title>
    <meta name="description" content="Notes, translations and paper write-ups by Senkang Forest Hu.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link rel="icon"
        href="data:image/svg+xml, <svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☯️</text></svg>">
    <style>
        :root {
            --bg: #ffffff;
            --text: #2c3e50;
            --muted: #6c757d;
            --line: #e9ecef;
            --accent: #2563eb;
            --accent-soft: rgba(37, 99, 235, 0.1);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #12151c;
                --text: #e6e9ef;
                --muted: #9aa3b2;
                --line: #262b36;
                --accent: #7aa2ff;
                --accent-soft: rgba(122, 162, 255, 0.14);
            }
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: 'Montserrat', -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
            line-height: 1.6;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .wrap {
            max-width: 760px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 22px 0;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .topbar a:hover,
        .post a.post-title:hover {
            color: var(--accent);
        }

        .topbar .home {
            color: var(--muted);
        }

        header.intro {
            padding: 56px 0 28px;
        }

        header.intro h1 {
            margin: 0 0 10px;
            font-family: 'Playfair Display', Georgia, serif;
            font-size: clamp(2.2rem, 6vw, 3rem);
            line-height: 1.15;
        }

        header.intro p {
            margin: 0;
            color: var(--muted);
            max-width: 34em;
        }

        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 8px 0 20px;
        }

        .filters button {
            font: inherit;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--muted);
            background: transparent;
            border: 1px solid var(--line);
            border-radius: 999px;
            padding: 6px 14px;
            cursor: pointer;
        }

        .filters button:hover {
            color: var(--accent);
        }

        .filters button[aria-pressed="true"] {
            color: var(--accent);
            background: var(--accent-soft);
            border-color: transparent;
        }

        .filters button:focus-visible,
        a:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 3px;
        }

        .year {
            margin: 28px 0 0;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--line);
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--muted);
            letter-spacing: 0.04em;
        }

        .post {
            display: grid;
            grid-template-columns: 96px 1fr;
            gap: 16px;
            padding: 20px 0;
            border-bottom: 1px solid var(--line);
        }

        .post-date {
            font-size: 0.85rem;
            color: var(--muted);
            padding-top: 3px;
        }

        .post a.post-title {
            font-size: 1.1rem;
            font-weight: 600;
            line-height: 1.4;
        }

        .post .ext {
            font-size: 0.8em;
            color: var(--muted);
        }

        .post p {
            margin: 6px 0 10px;
            color: var(--muted);
            font-size: 0.95rem;
        }

        .meta {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 12px;
            font-size: 0.8rem;
        }

        .meta .type {
            color: var(--accent);
            font-weight: 600;
        }

        .meta .tag {
            color: var(--muted);
        }

        .empty {
            padding: 40px 0;
            color: var(--muted);
        }

        footer {
            padding: 40px 0 56px;
            font-size: 0.85rem;
            color: var(--muted);
        }

        @media (max-width: 560px) {
            .post {
                grid-template-columns: 1fr;
                gap: 4px;
            }

            header.intro {
                padding-top: 32px;
            }
        }
    </style>
</head>

<body>
    <div class="wrap">
        <nav class="topbar" aria-label="Site">
            <a href="./">Senkang Forest Hu · Blog</a>
            <a class="home" href="https://dl-m9.github.io/">Homepage &rarr;</a>
        </nav>

        <header class="intro">
            <h1>Blog</h1>
            <p>Notes, translations and paper write-ups on LLM agents, agentic RL and model training.</p>
        </header>

        <div class="filters" id="filters" role="group" aria-label="Filter posts by topic"></div>

        <main id="posts" aria-live="polite">
            <noscript>
                <p class="empty">This page needs JavaScript to list the posts.</p>
            </noscript>
        </main>

        <footer>
            &copy; Senkang Forest Hu. Each post keeps its own license and credits.
        </footer>
    </div>

    <script>
        (function () {
            const list = document.getElementById('posts');
            const filters = document.getElementById('filters');
            let posts = [];
            let active = 'All';

            function el(tag, cls, text) {
                const node = document.createElement(tag);
                if (cls) node.className = cls;
                if (text) node.textContent = text;
                return node;
            }

            function render() {
                list.textContent = '';
                const shown = posts.filter(p => active === 'All' || p.category === active);
                if (!shown.length) {
                    list.appendChild(el('p', 'empty', 'No posts in this category yet.'));
                    return;
                }
                let year = '';
                shown.forEach(p => {
                    const y = p.date.split(' ').pop();
                    if (y !== year) {
                        year = y;
                        list.appendChild(el('h2', 'year', y));
                    }
                    const external = /^https?:/.test(p.link);
                    const article = el('article', 'post');
                    article.appendChild(el('div', 'post-date', p.date));

                    const body = el('div');
                    const title = el('a', 'post-title', p.title);
                    title.href = p.link;
                    if (external) {
                        title.target = '_blank';
                        title.rel = 'noopener noreferrer';
                        title.appendChild(el('span', 'ext', ' ↗'));
                    }
                    body.appendChild(title);
                    body.appendChild(el('p', '', p.summary));

                    const meta = el('div', 'meta');
                    meta.appendChild(el('span', 'type', p.category));
                    meta.appendChild(el('span', 'tag', p.type));
                    body.appendChild(meta);

                    article.appendChild(body);
                    list.appendChild(article);
                });
            }

            function renderFilters() {
                const types = ['All'].concat([...new Set(posts.map(p => p.category))]);
                filters.textContent = '';
                types.forEach(t => {
                    const btn = el('button', '', t);
                    btn.type = 'button';
                    btn.setAttribute('aria-pressed', String(t === active));
                    btn.addEventListener('click', () => {
                        active = t;
                        renderFilters();
                        render();
                    });
                    filters.appendChild(btn);
                });
            }

            fetch('posts.json')
                .then(r => r.json())
                .then(data => {
                    posts = data;
                    renderFilters();
                    render();
                })
                .catch(() => {
                    list.textContent = '';
                    list.appendChild(el('p', 'empty', 'Could not load the post list.'));
                });
        })();
    </script>
</body>

</html>
